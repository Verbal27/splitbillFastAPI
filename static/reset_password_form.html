<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%;
            width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex items-center justify-center">
    <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">Reset Your Password</h2>
        <div id="alert-box" class="hidden mb-4 p-4 text-sm text-red-800 rounded-lg bg-red-100" role="alert">
            <span class="font-medium">Error:</span> <span id="alert-message"></span>
        </div>
        <div id="success-box" class="hidden mb-4 p-4 text-sm text-green-800 rounded-lg bg-green-100" role="alert">
            <span class="font-medium">Success:</span> <span id="success-message"></span>
        </div>
        <form id="reset-password-form" class="space-y-4">
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">New Password</label>
                <input type="password" id="password" name="password" required class="w-full border border-slate-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label for="confirm_password" class="block text-sm font-medium text-slate-700 mb-1">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required class="w-full border border-slate-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <input type="hidden" id="token" name="token">
            <button type="submit" id="reset-btn" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition flex justify-center items-center">
                Reset Password
            </button>
        </form>
    </div>

    <script>
        const API_URL = ''; // Relative path, as it's served from the same origin
        const form = document.getElementById('reset-password-form');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm_password');
        const tokenInput = document.getElementById('token');
        const resetBtn = document.getElementById('reset-btn');
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        const successBox = document.getElementById('success-box');
        const successMessage = document.getElementById('success-message');

        function showError(msg) {
            alertMessage.innerText = msg;
            alertBox.classList.remove('hidden');
            successBox.classList.add('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 6000);
        }

        function showSuccess(msg) {
            successMessage.innerText = msg;
            successBox.classList.remove('hidden');
            alertBox.classList.add('hidden');
            setTimeout(() => successBox.classList.add('hidden'), 6000);
        }

        // Extract token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (token) {
            tokenInput.value = token;
        } else {
            showError('No reset token found in the URL.');
            resetBtn.disabled = true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            resetBtn.innerHTML = '<span class="loader"></span>';
            resetBtn.disabled = true;
            alertBox.classList.add('hidden');
            successBox.classList.add('hidden');

            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (password !== confirmPassword) {
                showError('Passwords do not match.');
                resetBtn.innerHTML = 'Reset Password';
                resetBtn.disabled = false;
                return;
            }

            if (!token) {
                showError('Missing reset token.');
                resetBtn.innerHTML = 'Reset Password';
                resetBtn.disabled = false;
                return;
            }

            try {
                const res = await fetch(`${API_URL}/users/reset-password-submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, password: password })
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.detail || `Password reset failed with status ${res.status}`);
                }

                showSuccess('Your password has been reset successfully! You can now log in.');
                form.reset();
                // Optionally redirect to login page
                // setTimeout(() => window.location.href = '/', 3000);

            } catch (err) {
                showError(err.message);
            } finally {
                resetBtn.innerHTML = 'Reset Password';
                resetBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
