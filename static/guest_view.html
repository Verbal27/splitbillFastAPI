<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitBill - Guest View</title>
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col">
    <nav class="bg-blue-600 text-white p-4 shadow-md flex justify-center items-center">
        <div class="flex items-center space-x-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h1 class="text-xl font-bold tracking-tight">SplitBill Guest View</h1>
        </div>
    </nav>

    <main class="flex-grow container mx-auto p-4 md:p-6 overflow-y-auto max-w-4xl">
        <!-- Alert Box -->
        <div id="alert-box" class="hidden mb-4 p-4 text-sm text-red-800 rounded-lg bg-red-100 border border-red-200">
            <span id="alert-message" class="font-medium"></span>
        </div>
        
        <!-- Loading State -->
        <div id="loading" class="flex justify-center items-center h-64">
            <span class="loader border-blue-500 w-10 h-10 border-4"></span>
        </div>

        <!-- Read-Only Bill Details -->
        <div id="bill-details" class="hidden bg-white p-6 md:p-8 rounded-xl shadow-sm border border-slate-200">
            <div class="border-b border-slate-100 pb-4 mb-6">
                <h2 class="text-3xl font-bold text-slate-800 mb-2" id="bd-title"></h2>
                <div class="flex items-center space-x-3 text-sm text-slate-500">
                    <span id="bd-status"></span>
                    <span id="bd-meta"></span>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="p-4 rounded-xl border border-slate-100 bg-slate-50">
                    <h3 class="font-bold text-slate-700 mb-3 flex items-center"><svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg> Members</h3>
                    <ul id="bd-members" class="space-y-1 text-sm text-slate-600"></ul>
                </div>
                <div class="p-4 rounded-xl border border-slate-100 bg-slate-50">
                    <h3 class="font-bold text-slate-700 mb-3 flex items-center"><svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg> Balances</h3>
                    <ul id="bd-balances" class="text-sm space-y-2"></ul>
                </div>
            </div>

            <div class="mb-8">
                <h3 class="font-bold text-xl text-slate-800 mb-4">Expenses & Payments</h3>
                <ul id="bd-expenses" class="border border-slate-200 rounded-xl divide-y divide-slate-100 text-sm bg-white"></ul>
            </div>

            <div class="pt-6 border-t border-slate-100">
                <h3 class="font-bold text-xl text-slate-800 mb-4">Comments</h3>
                <ul id="bd-comments" class="space-y-4"></ul>
            </div>
        </div>
    </main>

    <script src="/static/js/guest_app.js"></script>
</body>
</html>
